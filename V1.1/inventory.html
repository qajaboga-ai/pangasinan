<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Richers Admin — Printing Paper &amp; Ink Inventory</title>
<link rel="stylesheet" href="styles.css">
<style>
.inventory-table-wrap {
  overflow-x: auto;
}

.inventory-table {
  min-width: 850px;
}

.stock-controls {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.stock-value {
  min-width: 90px;
  font-weight: 600;
}

.stock-btn {
  width: 28px;
  height: 28px;
  border: 1px solid #cfd3dc;
  border-radius: 6px;
  background: #ffffff;
  color: #1f2430;
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
}

.stock-btn:hover {
  border-color: #2f6fed;
  color: #2f6fed;
}

.stock-btn:disabled {
  color: #8a90a0;
  cursor: not-allowed;
}

.action-link {
  padding: 0;
  border: 0;
  background: transparent;
  font: inherit;
  text-align: left;
}

.inventory-summary {
  margin: -14px 0 18px;
  color: #5b6270;
  font-size: 13px;
}

.inventory-message {
  margin: 0 0 16px;
  padding: 10px 14px;
  border-radius: 8px;
  background: #fbe3e1;
  color: #a52b22;
  font-size: 13px;
}

.inventory-message[hidden] {
  display: none;
}
</style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="brand">RICHERS <span>ADMIN</span></div>

    <a href="admindashboard.html" class="nav-item"><span class="icon">📊</span> Dashboard</a>
    <a href="transaction-details.html" class="nav-item"><span class="icon">📦</span> Transactions</a>
    <a href="inventory.html" class="nav-item active"><span class="icon">🖨️</span> Inventory &amp; Supplies</a>
    <a href="customers.html" class="nav-item"><span class="icon">👥</span> Customer Records</a>
    <a href="reports.html" class="nav-item"><span class="icon">📈</span> Reports</a>
  </div>

  <!-- Main content -->
  <div class="main">
    <div class="page-header-row">
      <div>
        <h1 class="page-title">Printing Paper &amp; Ink Inventory</h1>
        <p class="page-subtitle">Manage supply quantities, add inventory items, and monitor reorder levels</p>
      </div>
      <button class="btn-dark" id="addSupplyButton" type="button">+ Add Supply Item</button>
    </div>

    <p class="inventory-summary" id="inventorySummary" aria-live="polite"></p>
    <p class="inventory-message" id="inventoryMessage" role="alert" hidden></p>

    <div class="pipeline-card inventory-table-wrap">
      <table class="inventory-table">
        <thead>
          <tr>
            <th>Supply Item Code</th>
            <th>Item Description</th>
            <th>Category</th>
            <th>Current Stock</th>
            <th>Min Reorder Threshold</th>
            <th>Stock Level</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="inventoryRows"></tbody>
      </table>
    </div>
  </div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
  const DEFAULT_ITEMS = [
    { code: 'PAP-A4-80', description: 'A4 Paper 80gsm (500 Sheets/Ream)', category: 'Paper Stock', unit: 'Reams', quantity: 50, reorder_level: 20 },
    { code: 'PAP-A4-70', description: 'A4 Paper 70gsm Standard', category: 'Paper Stock', unit: 'Reams', quantity: 50, reorder_level: 25 },
    { code: 'INK-BLK-EP', description: 'Epson Black High-Cap Ink Cartridge', category: 'Ink & Toner', unit: 'Bottles', quantity: 50, reorder_level: 5 },
    { code: 'BND-RNG-12', description: 'Spiral Ring Binding Coils (12mm)', category: 'Finishing Materials', unit: 'Units', quantity: 50, reorder_level: 100 },
    { code: 'TAR-VIN-13', description: 'Heavy Duty Vinyl Tarpaulin Roll 13oz', category: 'Large Format Roll', unit: 'Rolls', quantity: 50, reorder_level: 5 }
  ];
  const rowsElement = document.getElementById('inventoryRows');
  const summaryElement = document.getElementById('inventorySummary');
  const messageElement = document.getElementById('inventoryMessage');
  let items = [];

  function showMessage(message) {
    messageElement.textContent = message;
    messageElement.hidden = false;
  }

  function clearMessage() {
    messageElement.textContent = '';
    messageElement.hidden = true;
  }

  function makeCell(text, className) {
    const cell = document.createElement('td');
    cell.textContent = text;
    if (className) cell.className = className;
    return cell;
  }

  async function reloadItems() {
    const { data, error } = await window.richersDb.client
      .from('inventory')
      .select('id, code, description, category, unit, quantity, reorder_level')
      .order('id');
    if (error) throw error;
    items = data;
    render();
  }

  async function setStock(item, newStock) {
    if (!Number.isInteger(newStock) || newStock < 0) return;
    try {
      const { error } = await window.richersDb.client
        .from('inventory')
        .update({ quantity: newStock, updated_at: new Date().toISOString() })
        .eq('id', item.id);
      if (error) throw error;
      await reloadItems();
    } catch (error) {
      console.error('Inventory update failed:', error);
      showMessage('Inventory change could not be saved. ' + error.message);
    }
  }

  function render() {
    rowsElement.replaceChildren();
    let lowStockCount = 0;

    items.forEach((item) => {
      const row = document.createElement('tr');
      row.appendChild(makeCell(item.code, 'item-code'));
      row.appendChild(makeCell(item.description));
      row.appendChild(makeCell(item.category));

      const stockCell = document.createElement('td');
      const controls = document.createElement('span');
      controls.className = 'stock-controls';
      const decrement = document.createElement('button');
      decrement.className = 'stock-btn';
      decrement.type = 'button';
      decrement.textContent = '−';
      decrement.setAttribute('aria-label', 'Use one ' + item.unit + ' of ' + item.description);
      decrement.disabled = item.quantity === 0;
      const stockValue = document.createElement('span');
      stockValue.className = 'stock-value';
      stockValue.textContent = item.quantity + ' ' + item.unit;
      const increment = document.createElement('button');
      increment.className = 'stock-btn';
      increment.type = 'button';
      increment.textContent = '+';
      increment.setAttribute('aria-label', 'Add one ' + item.unit + ' of ' + item.description);
      decrement.addEventListener('click', () => setStock(item, item.quantity - 1));
      increment.addEventListener('click', () => setStock(item, item.quantity + 1));
      controls.append(decrement, stockValue, increment);
      stockCell.appendChild(controls);
      row.appendChild(stockCell);
      row.appendChild(makeCell(item.reorder_level + ' ' + item.unit));

      const statusCell = document.createElement('td');
      const badge = document.createElement('span');
      const isLow = item.quantity <= item.reorder_level;
      if (isLow) lowStockCount++;
      badge.className = 'badge ' + (isLow ? 'low-stock' : 'sufficient');
      badge.textContent = isLow ? 'LOW STOCK WARNING' : 'SUFFICIENT';
      statusCell.appendChild(badge);
      row.appendChild(statusCell);

      const actionCell = document.createElement('td');
      const restock = document.createElement('button');
      restock.className = 'action-link' + (isLow ? ' stack' : '');
      restock.type = 'button';
      restock.textContent = isLow ? 'Reorder Now' : 'Restock';
      restock.addEventListener('click', () => {
        const amount = prompt('Enter quantity to add to stock (current: ' + item.quantity + ' ' + item.unit + '):', '50');
        if (amount === null) return;
        if (!/^\d+$/.test(amount.trim()) || Number(amount) < 1) {
          alert('Enter a whole number greater than zero.');
          return;
        }
        setStock(item, item.quantity + Number(amount));
      });
      actionCell.appendChild(restock);
      row.appendChild(actionCell);
      rowsElement.appendChild(row);
    });

    summaryElement.textContent = items.length + ' supply items · ' + lowStockCount + ' at or below reorder threshold';
  }

  document.getElementById('addSupplyButton').addEventListener('click', async function () {
    const code = prompt('Enter a unique supply item code:');
    if (code === null) return;
    const normalizedCode = code.trim().toUpperCase();
    if (!normalizedCode) {
      alert('Supply item code is required.');
      return;
    }
    if (items.some((item) => item.code.toUpperCase() === normalizedCode)) {
      alert('That supply item code already exists.');
      return;
    }

    const description = prompt('Enter item description:');
    if (description === null) return;
    if (!description.trim()) {
      alert('Item description is required.');
      return;
    }

    const category = prompt('Enter item category:');
    if (category === null) return;
    if (!category.trim()) {
      alert('Item category is required.');
      return;
    }

    const unit = prompt('Enter stock unit (for example: Reams, Bottles, or Rolls):');
    if (unit === null) return;
    if (!unit.trim()) {
      alert('Stock unit is required.');
      return;
    }

    const thresholdInput = prompt('Enter minimum reorder threshold:', '10');
    if (thresholdInput === null) return;
    if (!/^\d+$/.test(thresholdInput.trim())) {
      alert('Enter a non-negative whole number for the reorder threshold.');
      return;
    }

    const newItem = {
      code: normalizedCode,
      item_name: description.trim(),
      description: description.trim(),
      category: category.trim(),
      unit: unit.trim(),
      quantity: 50,
      reorder_level: Number(thresholdInput)
    };
    try {
      const { error } = await window.richersDb.client.from('inventory').insert(newItem);
      if (error) throw error;
      await reloadItems();
    } catch (error) {
      console.error('Could not add inventory item:', error);
      showMessage('Supply item could not be added. ' + error.message);
    }
  });

  try {
    const session = await window.richersDb.requireUser({ admin: true });
    if (!session) return;
    await reloadItems();
    if (items.length === 0) {
      const { error } = await window.richersDb.client.from('inventory').insert(DEFAULT_ITEMS.map(function (item) {
        return { ...item, item_name: item.description };
      }));
      if (error) throw error;
      await reloadItems();
    }
  } catch (error) {
    console.error('Could not load inventory:', error);
    showMessage('Inventory could not be loaded. Check your admin account and database setup. ' + error.message);
  }
});
</script>
</body>
</html>
