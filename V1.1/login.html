<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Richers Printing — Login</title>
<link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="brand-header">
    <h1 class="brand-title">RICHERS PRINTING</h1>
    <p class="brand-subtitle">Service Management & Ordering Process System</p>
  </div>

  <div class="login-card">
    <div class="error-banner" id="errorBanner"></div>

    <form id="loginForm" novalidate>
      <div class="field-group">
        <label class="field-label" for="email">Email Address</label>
        <input type="email" id="email" class="field-input" placeholder="richersprinting@gmail.com">
      </div>

      <div class="field-group">
        <label class="field-label" for="password">Password</label>
        <input type="password" id="password" class="field-input" placeholder="">
      </div>

      <div class="options-row">
        <label class="remember-label">
          <input type="checkbox" id="rememberDevice"> Remember device
        </label>
        <a href="#" class="forgot-link">Forgot Password?</a>
      </div>

      <button type="submit" class="login-btn">Login</button>
    </form>

    <p class="signup-line">Dont Have Account? <a href="signup.html">Create One</a></p>

    <div class="notice-box">
      ⚠ Account Registration is REQUIRED to prevent fake orders and maintain verified ownership records for RICHERS PRINTING SERVICE.
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
